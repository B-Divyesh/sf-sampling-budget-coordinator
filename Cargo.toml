[package]
name = "sampling-budget-coordinator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Replica-aware OpenTelemetry sampling budget planner and deploy assertion"
repository = "https://github.com/B-Divyesh/sf-sampling-budget-coordinator"
readme = "README.md"
keywords = ["opentelemetry", "sampling", "observability", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".factory/**", "site/**", "dist/**", "package*.json", "playwright.config.ts"]

[lib]
name = "sampling_budget_coordinator"
path = "src/lib.rs"

[[bin]]
name = "sbc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"

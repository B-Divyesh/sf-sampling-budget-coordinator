name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Run the full gate twice in the fresh Actions checkout. Browser tests
      # use an isolated Playwright worker per test, so a crashed Chromium
      # process is retried in a new process instead of invalidating the suite.
      - run: npm run test:repeat
